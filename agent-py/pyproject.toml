[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lifeops-ai-agent"
version = "0.1.0"
description = "Voice-first life operations agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "uvicorn[standard]>=0.30,<1"
]

[project.optional-dependencies]
openai = ["openai-agents>=0.0.19,<1"]
livekit = ["livekit-agents>=1.0,<2", "livekit-plugins-openai>=1.0,<2", "livekit-plugins-silero>=1.0,<2"]
moss = ["moss>=1.0,<2"]
brightdata = ["playwright>=1.50,<2"]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1", "mypy>=1.13,<2"]
all = ["lifeops-ai-agent[openai,livekit,moss,brightdata,dev]"]

[tool.hatch.build.targets.wheel]
packages = ["src/lifeops"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
